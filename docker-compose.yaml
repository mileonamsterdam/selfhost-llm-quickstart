services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    #restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    entrypoint: >
      bash -c "
      ollama serve
      "
    # force ways to use the NVIDIA runtime
    gpu: all
    devices:
      - "nvidia.com/gpu=all"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
volumes:
  ollama_data:
    name: ollama_data
    driver: local

# source https://podman-desktop.io/docs/podman/gpu
